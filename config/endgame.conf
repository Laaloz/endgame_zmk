# Endgame Split - battery test config

# Power saving
CONFIG_ZMK_SLEEP=y

# Idle after 15 seconds
CONFIG_ZMK_IDLE_TIMEOUT=15000

# Deep sleep after 5 minutes (left / central).
# The right half overrides this in build.yaml (cmake-args).
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600

# IMPORTANT:
# Disable Studio temporarily for battery/sleep testing
CONFIG_ZMK_STUDIO=n

# Choc debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=4
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=6

# BLE / Linux (BlueZ) fix — same as the Lily58 config
# 2M PHY off: stable connection on Linux hosts
CONFIG_BT_CTLR_PHY_2M=n
# No automatic security request on connect (BlueZ pairing/reconnect issue)
CONFIG_BT_GATT_AUTO_SEC_REQ=n
# +8 dBm TX power: helps both the host and the split link
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
