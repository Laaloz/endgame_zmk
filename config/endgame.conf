# Endgame Split - firmware settings

# NOTE:
# Zephyr .conf does not allow inline comments after a value.
# Keep comments on their own lines.

# ------------------------------------------------------------
# Power saving
# ------------------------------------------------------------

# Enable deep sleep support
CONFIG_ZMK_SLEEP=y

# Enter idle state after 15 seconds of inactivity.
# Bluetooth stays connected in idle, so wake-up is immediate.
CONFIG_ZMK_IDLE_TIMEOUT=15000

# Enter deep sleep after 3 minutes of inactivity.
# Bluetooth disconnects and power consumption drops very low.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=180000


# ------------------------------------------------------------
# Battery
# ------------------------------------------------------------

# Enable battery monitoring/reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Report battery level every 10 minutes instead of every minute
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600


# ------------------------------------------------------------
# Bluetooth
# ------------------------------------------------------------

# Do not force TX power here.
# nice!nano v2 uses Nordic's SoftDevice controller and settings such as
# CONFIG_BT_CTLR_TX_PWR_PLUS_8 can cause the build to fail.


# ------------------------------------------------------------
# ZMK Studio
# ------------------------------------------------------------

# Allow editing the keymap with ZMK Studio
CONFIG_ZMK_STUDIO=y


# ------------------------------------------------------------
# Key scanning / debounce
# ------------------------------------------------------------

# Kailh Choc + hotswap debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=4
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=6