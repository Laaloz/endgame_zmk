# Endgame Split — GitHub Actions build matrix
# Build both halves for the nice!nano v2.
---
include:
  - board: nice_nano_v2
    shield: endgame_left
  - board: nice_nano_v2
    shield: endgame_right
    # Right half: deep sleep only after 60 min of inactivity (left: 5 min)
    cmake-args: -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
    
